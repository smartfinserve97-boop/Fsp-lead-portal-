<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join - ICICI Life</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#F8FAFF;padding:12px}
.wrap{max-width:440px;margin:0 auto}
input,select{width:100%;padding:14px;margin-top:10px;border-radius:12px;border:1.5px solid #E2E8F0;font-size:15px}
.btn-wa{width:100%;background:#25D366;color:#fff;padding:14px;border-radius:12px;border:none;font-weight:800;margin-top:14px;font-size:16px;cursor:pointer}
.btn-call{display:block;background:#0B1220;color:#fff;text-align:center;padding:14px;border-radius:12px;margin-top:10px;text-decoration:none;font-weight:700}
.card{margin-top:18px;background:linear-gradient(135deg,#0B1220,#1E3A8A);color:#fff;padding:16px;border-radius:16px;display:flex;justify-content:space-between;align-items:center}
.card img{width:84px;height:84px;border-radius:50%;border:3px solid #fff;object-fit:cover}
.btn-dl{width:100%;margin-top:10px;padding:12px;border-radius:10px;border:1px solid #E2E8F0;background:#fff;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
<h2 style="text-align:center">Join ICICI Prudential Life</h2>
<form id="leadForm">
<input id="name" placeholder="Full Name *" required>
<input id="phone" placeholder="Phone * (10 Digit)" required pattern="[0-9]{10}">
<input id="city" placeholder="City *" required>
<select id="occupation" required><option value="">Occupation *</option><option>Student</option><option>Salaried</option><option>Business</option><option>Homemaker</option><option>Other</option></select>
<select id="qualification" required><option value="">Qualification *</option><option>10th</option><option>12th</option><option>Graduate</option><option>Post Graduate</option></select>
<button type="submit" class="btn-wa">WhatsApp Pe Apply Karo</button>
<a href="tel:7667456772" class="btn-call">Call Now - 7667456772</a>
</form>

<div class="card" id="visitingCard">
<div>
<div style="font-size:12px;opacity:.8;letter-spacing:2px">ICICI PRUDENTIAL LIFE</div>
<div style="font-size:26px;font-weight:800;margin-top:6px">Adil Hussain</div>
<div style="font-size:14px;margin-top:4px">Financial Services Professional</div>
<div style="font-size:13px;margin-top:8px">📞 7667456772 | 📍 Pan India</div>
</div>
<img id="cardPhoto" src="profile.jpg" alt="photo">
</div>
<button class="btn-dl" onclick="downloadCard()">Download Visiting Card (Photo ke saath)</button>
</div>

<script>
const API_URL = "https://crudcrud.com/api/325590dfaf4e4c8db1e7212caab1402c/leads";

document.getElementById('leadForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const data = {
    name: document.getElementById('name').value.trim(),
    phone: document.getElementById('phone').value.trim(),
    city: document.getElementById('city').value.trim(),
    occupation: document.getElementById('occupation').value,
    qualification: document.getElementById('qualification').value,
    date: new Date().toISOString()
  };
  // 1. Database me save (ab bahar ke user ka bhi aapke admin me dikhega)
  try{ await fetch(API_URL, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data)}); }catch(err){}
  // 2. WhatsApp
  const msg = `New Lead - ICICI Life:%0AName: ${data.name}%0APhone: ${data.phone}%0ACity: ${data.city}%0AOccupation: ${data.occupation}%0AQualification: ${data.qualification}`;
  window.open(`https://wa.me/917667456772?text=${msg}`, '_blank');
  e.target.reset();
  alert('Thank you! Data saved.');
});

// Visiting Card Photo Fix - 100% kaam karega
async function downloadCard(){
  const canvas = document.createElement('canvas');
  canvas.width = 1050; canvas.height = 600;
  const ctx = canvas.getContext('2d');
  const grad = ctx.createLinearGradient(0,0,1050,0);
  grad.addColorStop(0,'#0B1220'); grad.addColorStop(1,'#1E3A8A');
  ctx.fillStyle = grad; ctx.fillRect(0,0,1050,600);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 32px sans-serif'; ctx.fillText('ICICI PRUDENTIAL LIFE', 50, 80);
  ctx.font = 'bold 58px sans-serif'; ctx.fillText('Adil Hussain', 50, 210);
  ctx.font = '26px sans-serif'; ctx.fillText('Financial Services Professional', 50, 260);
  ctx.font = '28px sans-serif'; ctx.fillText('📞 7667456772 | 📍 Pan India', 50, 340);
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.src = 'profile.jpg'; // agar aapki photo ka naam aadil.jpg hai toh yahan change kar do
  img.onload = () => {
    ctx.save(); ctx.beginPath(); ctx.arc(850, 300, 115, 0, Math.PI*2); ctx.clip();
    ctx.drawImage(img, 735, 185, 230, 230); ctx.restore();
    ctx.strokeStyle='#fff'; ctx.lineWidth=6; ctx.beginPath(); ctx.arc(850,300,115,0,Math.PI*2); ctx.stroke();
    const link = document.createElement('a'); link.download='ICICI-Visiting-Card.png'; link.href=canvas.toDataURL('image/png'); link.click();
  };
  img.onerror = () => { // photo na mile tab bhi card download hoga
    const link = document.createElement('a'); link.download='ICICI-Visiting-Card.png'; link.href=canvas.toDataURL('image/png'); link.click();
  };
}
</script>
</body>
  </html>
